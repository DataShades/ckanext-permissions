default_install_hook_types:
- pre-commit
- pre-push

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: end-of-file-fixer
    exclude: '\.css$'
    stages: [pre-commit]
  - id: trailing-whitespace
    stages: [pre-commit]
  - id: debug-statements
    stages: [pre-push]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.7
  hooks:
  - id: ruff
    args: [--fix]
    stages: [pre-commit]
  - id: ruff-format
    stages: [pre-commit]

# pyright needs CKAN installed to resolve imports, so it runs with the active
# interpreter instead of an isolated pre-commit env. Manual only until the
# existing errors are fixed: pre-commit run pyright --hook-stage manual
- repo: local
  hooks:
  - id: pyright
    name: pyright
    entry: bash -c 'pyright --pythonpath="$(command -v python)"'
    language: system
    types: [python]
    pass_filenames: false
    stages: [manual]
