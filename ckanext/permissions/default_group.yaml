name: Default group
description: Default permissions implemented within the ckanext-permissions
permissions:
  - key: read_any_dataset
    label: Read any dataset
    description: User can read any dataset

  - key: read_private_dataset
    label: Read private dataset
    description: User can read private datasets

  - key: update_any_dataset
    label: Update any dataset
    description: User can update any dataset
    anonymous: false
    depends_on:
      - read_any_dataset

  - key: delete_any_dataset
    label: Delete any dataset
    description: User can delete any dataset
    anonymous: false
    depends_on:
      - read_any_dataset

  - key: delete_any_resource
    label: Delete any resource
    description: User can delete any resource
    anonymous: false
    depends_on:
      - update_any_dataset

  - key: create_dataset
    label: Create dataset
    description: User can create datasets in any organization
    anonymous: false

  - key: purge_dataset
    label: Purge dataset
    description: User can permanently remove any deleted dataset
    anonymous: false
    depends_on:
      - delete_any_dataset

  - key: manage_dataset_collaborators
    label: Manage dataset collaborators
    description: User can add and remove collaborators on any dataset, except themselves
    anonymous: false
    depends_on:
      - read_any_dataset

  - key: bulk_update_datasets
    label: Bulk update datasets
    description: User can make public, make private or delete datasets in bulk on the organization page
    anonymous: false
    depends_on:
      - update_any_dataset
      - delete_any_dataset

  - key: manage_organization_members
    label: Manage organization members
    description: User can add, change and remove organization members, except admins and themselves
    anonymous: false

  - key: create_organization
    label: Create organization
    description: User can create organizations and becomes their admin
    anonymous: false

  - key: create_group
    label: Create group
    description: User can create groups and becomes their admin
    anonymous: false

  - key: manage_any_group
    label: Manage any group
    description: User can edit any group, manage its members and add or remove its datasets
    anonymous: false
