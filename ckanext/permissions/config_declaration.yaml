version: 1
groups:
  - annotation: ckanext-permissions
    options:
      - key: ckanext.permissions.permission_groups
        description: The list of permission groups to load
        type: list
        editable: false
        default:
          - ckanext.permissions:default_group.yaml

      - key: ckanext.permissions.roles
        description: The list of role declaration files to load
        type: list
        editable: false
        default: []
