css:
  filter: cssrewrite
  output: ckanext-permissions/%(version)s-permission-manager.css
  contents:
  - css/vendor/tomselect.min.css
  - css/style.css

js:
  filter: rjsmin
  output: ckanext-permissions/%(version)s-permissions.js
  contents:
  - js/vendor/tomselect.min.js
  - js/perm-tom-select.js
  - js/perm-search-permissions.js
  - js/perm-permission-dependencies.js
  - js/perm-permission-matrix.js
  - js/perm-confirm-role-removal.js
  - js/perm-auto-submit.js
  extra:
    preload:
    - base/main
    - base/ckan
